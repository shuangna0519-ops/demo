<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f8f9fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: white; border-radius: 16px; padding: 40px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 360px; }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h3 { color: #333; margin-bottom: 12px; }
    p { color: #666; line-height: 1.6; font-size: 14px; }
    .tag { display: inline-block; margin-top: 16px; padding: 4px 12px; background: #e3f2fd; color: #1976d2; border-radius: 12px; font-size: 12px; }
</style>
</head>
<body>
<div class="card">
    <div class="icon">🤖</div>
    <h3>通用应用模板</h3>
    <p>未能匹配到特定模板，已为你展示通用占位模板。<br>试试输入"待办清单"、"天气"、"时钟"或"计算器"。</p>
    <span class="tag">default template</span>
</div>
</body>
</html>
