<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI 应用生成器{% endblock %}</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f5f7fa; color: #212529; font-size: 1rem; line-height: 1.5; }
        .container { width: 100%; max-width: 1140px; margin: 0 auto; padding: 0 12px; }
        .py-4 { padding-top: 1.5rem; padding-bottom: 1.5rem; }
        .g-4 { gap: 1.5rem; }
        .row { display: flex; flex-wrap: wrap; margin: 0 -12px; }
        .col-lg-5, .col-lg-7 { position: relative; width: 100%; padding: 0 12px; }
        @media (min-width: 992px) { .col-lg-5 { flex: 0 0 41.666667%; max-width: 41.666667%; } .col-lg-7 { flex: 0 0 58.333333%; max-width: 58.333333%; } }
        .h-100 { height: 100%; }
        .d-flex { display: flex; }
        .justify-content-between { justify-content: space-between; }
        .align-items-center { align-items: center; }
        .mb-0 { margin-bottom: 0; }
        .mt-3 { margin-top: 1rem; }
        .mt-4 { margin-top: 1.5rem; }
        .mb-3 { margin-bottom: 1rem; }
        .text-muted { color: #6c757d; }
        .text-white-50 { color: rgba(255,255,255,0.5); }
        .small { font-size: 0.875rem; }
        .w-100 { width: 100%; }
        .border-0 { border: 0; }
        .rounded-bottom { border-bottom-left-radius: 0.375rem; border-bottom-right-radius: 0.375rem; }

        /* Navbar */
        .navbar { display: flex; align-items: center; padding: 0.5rem 0; background-color: #0d6efd; color: #fff; }
        .navbar-brand { font-size: 1.25rem; font-weight: 500; color: #fff; text-decoration: none; }

        /* Card */
        .card { position: relative; display: flex; flex-direction: column; background-color: #fff; border: 1px solid rgba(0,0,0,0.125); border-radius: 0.375rem; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075); }
        .card-header { padding: 0.5rem 1rem; background-color: rgba(0,0,0,0.03); border-bottom: 1px solid rgba(0,0,0,0.125); border-radius: calc(0.375rem - 1px) calc(0.375rem - 1px) 0 0; }
        .card-body { flex: 1 1 auto; padding: 1rem; }
        .card-title { margin-bottom: 0.5rem; font-size: 1.1rem; font-weight: 500; }

        /* Form */
        .form-control { display: block; width: 100%; padding: 0.375rem 0.75rem; font-size: 1rem; line-height: 1.5; color: #212529; background-color: #fff; border: 1px solid #ced4da; border-radius: 0.375rem; }
        .form-control:focus { border-color: #86b7fe; outline: 0; box-shadow: 0 0 0 0.25rem rgba(13,110,253,0.25); }
        textarea.form-control { min-height: 100px; resize: vertical; font-family: inherit; }

        /* Buttons */
        .btn { display: inline-block; padding: 0.375rem 0.75rem; font-size: 1rem; font-weight: 400; line-height: 1.5; text-align: center; cursor: pointer; border: 1px solid transparent; border-radius: 0.375rem; text-decoration: none; user-select: none; }
        .btn:disabled { opacity: 0.65; pointer-events: none; }
        .btn-primary { color: #fff; background-color: #0d6efd; border-color: #0d6efd; }
        .btn-primary:hover { background-color: #0b5ed7; border-color: #0a58ca; }
        .btn-outline-primary { color: #0d6efd; border-color: #0d6efd; background-color: transparent; }
        .btn-outline-primary:hover { color: #fff; background-color: #0d6efd; }
        .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.875rem; border-radius: 0.25rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }

        /* Badge */
        .badge { display: inline-block; padding: 0.35em 0.65em; font-size: 0.75em; font-weight: 700; line-height: 1; color: #fff; text-align: center; border-radius: 0.375rem; }
        .bg-primary { background-color: #0d6efd; }
        .bg-secondary { background-color: #6c757d; }
        .bg-success { background-color: #198754; }
        .bg-info { background-color: #0dcaf0; }
        .bg-light { background-color: #f8f9fa; }
        .bg-white { background-color: #fff; }
        .text-white { color: #fff; }

        /* Table */
        .table { width: 100%; margin-bottom: 1rem; vertical-align: top; border-collapse: collapse; }
        .table > :not(caption) > * > * { padding: 0.5rem; border-bottom: 1px solid #dee2e6; }
        .table-hover > tbody > tr:hover { background-color: rgba(0,0,0,0.075); }
        .table-light > :not(caption) > * > * { background-color: #f8f9fa; }
        .align-middle { vertical-align: middle; }
        .table-responsive { overflow-x: auto; }

        /* iframe */
        iframe { display: block; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <span class="navbar-brand">✨ AI 应用生成器 Demo</span>
            <span class="text-white-50 small">输入描述 · 一键生成 · 即时预览</span>
        </div>
    </nav>
    <div class="container py-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
