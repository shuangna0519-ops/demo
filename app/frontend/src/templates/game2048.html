<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048 小游戏</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f7f6;color:#31413d;min-height:100vh;display:flex;justify-content:center;padding:20px}
  .app{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center}
  h1{font-size:20px;font-weight:700;color:#0f5c4c}
  .sub{font-size:13px;color:#7b8d89;margin-top:6px;text-align:center}
  .top{display:flex;gap:10px;align-items:center;justify-content:space-between;width:100%;margin:14px 0 10px;flex-wrap:wrap}
  .scores{display:flex;gap:10px}
  .box{background:#eaf1ef;border-radius:8px;padding:6px 14px;text-align:center;min-width:74px}
  .box span{display:block;font-size:11px;color:#7b8d89}
  .box b{font-size:17px;color:#0f5c4c;font-variant-numeric:tabular-nums}
  button{font:inherit;border-radius:8px;border:1px solid #cfdedb;background:#fff;padding:8px 12px;cursor:pointer;color:#31413d}
  .primary{background:#0f5c4c;color:#fff;border-color:#0f5c4c}
  .primary:hover{background:#0c4a3d}
  .board{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#cfdedb;border-radius:12px;padding:10px;width:100%;aspect-ratio:1;touch-action:none}
  .tile{display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:700;font-size:clamp(16px,5.5vw,28px);background:#eef7f5;color:#31413d;transition:transform .12s ease}
  .t2{background:#eef7f5}.t4{background:#dceee8}.t8{background:#a8d8c9;color:#0c3b31}
  .t16{background:#6fc0a8;color:#fff}.t32{background:#3f9e83;color:#fff}.t64{background:#0f5c4c;color:#fff}
  .t128{background:#0c4a3d;color:#fff}.t256{background:#0a3d32;color:#fff}.t512{background:#08322a;color:#fff}
  .t1024{background:#062821;color:#fff}.t2048{background:#04201a;color:#fff}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(243,247,246,.93);border-radius:12px;text-align:center;padding:20px}
  .overlay.hide{display:none}
  .overlay h2{font-size:18px;color:#0f5c4c}
  .overlay p{font-size:13px;color:#6b7d79;line-height:1.6}
  .help{margin-top:12px;font-size:12px;color:#8b9a96;text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="app">
  <h1>2048 小游戏</h1>
  <p class="sub">方向键 / WASD 或滑动屏幕移动方块，相同数字相撞即合并</p>

  <div class="top">
    <div class="scores">
      <div class="box"><span>得分</span><b id="score">0</b></div>
      <div class="box"><span>最高分</span><b id="best">0</b></div>
    </div>
    <button class="primary" id="new">重新开始</button>
  </div>

  <div class="board" id="board">
    <div class="overlay hide" id="overlay">
      <h2 id="ovTitle"></h2>
      <p id="ovText"></p>
      <button class="primary" id="ovBtn">再来一局</button>
    </div>
  </div>

  <p class="help">目标：合成 2048。无法移动时游戏结束。</p>
</div>

<script>
(function(){
  var SIZE=4;
  var grid,score=0,best=0,over=false,won=false;

  function emptyGrid(){
    var g=[];for(var r=0;r<SIZE;r++)g.push(new Array(SIZE).fill(0));
    return g;
  }

  function emptyCells(){
    var list=[];
    for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++)if(!grid[r][c])list.push({r:r,c:c});
    return list;
  }

  function addTile(){
    var cells=emptyCells();
    if(!cells.length)return;
    var pick=cells[Math.floor(Math.random()*cells.length)];
    grid[pick.r][pick.c]=Math.random()<0.9?2:4;
  }

  function render(){
    var board=document.getElementById('board');
    board.innerHTML='';
    for(var r=0;r<SIZE;r++){
      for(var c=0;c<SIZE;c++){
        var v=grid[r][c];
        var d=document.createElement('div');
        d.className='tile'+(v?' t'+v:'');
        d.textContent=v?v:'';
        board.appendChild(d);
      }
    }
    board.appendChild(document.getElementById('overlay'));
    document.getElementById('score').textContent=score;
    document.getElementById('best').textContent=best;
  }

  function slideRow(row){
    var vals=row.filter(function(v){return v!==0});
    var out=[],gained=0;
    for(var i=0;i<vals.length;i++){
      if(i+1<vals.length&&vals[i]===vals[i+1]){
        var merged=vals[i]*2;
        out.push(merged);
        gained+=merged;
        if(merged===2048&&!won){won=true}
        i++;
      } else {
        out.push(vals[i]);
      }
    }
    while(out.length<SIZE)out.push(0);
    return {row:out,gained:gained};
  }

  function move(dir){
    if(over)return;
    var before=JSON.stringify(grid);
    var gained=0;
    var r,c;
    for(var i=0;i<SIZE;i++){
      var line=[];
      for(var j=0;j<SIZE;j++){
        if(dir==='left'){r=i;c=j}
        else if(dir==='right'){r=i;c=SIZE-1-j}
        else if(dir==='up'){r=j;c=i}
        else {r=SIZE-1-j;c=i}
        line.push(grid[r][c]);
      }
      var res=slideRow(line);
      gained+=res.gained;
      for(var k=0;k<SIZE;k++){
        var rr,cc;
        if(dir==='left'){rr=i;cc=k}
        else if(dir==='right'){rr=i;cc=SIZE-1-k}
        else if(dir==='up'){rr=k;cc=i}
        else {rr=SIZE-1-k;cc=i}
        grid[rr][cc]=res.row[k];
      }
    }
    if(JSON.stringify(grid)===before)return;
    score+=gained;
    if(score>best)best=score;
    addTile();
    render();
    if(won&&!over){over=true;showOverlay('达成 2048！','你用 '+score+' 分合成了 2048，还能继续挑战更高分。','再来一局');return}
    if(!canMove()){over=true;showOverlay('游戏结束','没有可移动的方向了，最终得分 '+score+'。','再来一局')}
  }

  function canMove(){
    if(emptyCells().length)return true;
    for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++){
      var v=grid[r][c];
      if(c+1<SIZE&&grid[r][c+1]===v)return true;
      if(r+1<SIZE&&grid[r+1][c]===v)return true;
    }
    return false;
  }

  function showOverlay(title,text,btn){
    document.getElementById('ovTitle').textContent=title;
    document.getElementById('ovText').textContent=text;
    document.getElementById('ovBtn').textContent=btn;
    document.getElementById('overlay').classList.remove('hide');
    render();
  }

  function newGame(){
    grid=emptyGrid();score=0;over=false;won=false;
    addTile();addTile();
    document.getElementById('overlay').classList.add('hide');
    render();
  }

  document.addEventListener('keydown',function(e){
    var k=e.key.toLowerCase();
    if(k==='arrowleft'||k==='a'){move('left');e.preventDefault()}
    else if(k==='arrowright'||k==='d'){move('right');e.preventDefault()}
    else if(k==='arrowup'||k==='w'){move('up');e.preventDefault()}
    else if(k==='arrowdown'||k==='s'){move('down');e.preventDefault()}
  });

  var sx=0,sy=0,swiped=false;
  var board=document.getElementById('board');
  board.addEventListener('touchstart',function(e){
    var t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;swiped=false;
  },{passive:true});
  board.addEventListener('touchmove',function(e){
    if(swiped)return;
    var t=e.changedTouches[0];
    var dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)<28&&Math.abs(dy)<28)return;
    swiped=true;
    if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');
    else move(dy>0?'down':'up');
  },{passive:true});

  document.getElementById('new').addEventListener('click',newGame);
  document.getElementById('ovBtn').addEventListener('click',newGame);
  newGame();
})();
</script>
</body>
</html>
