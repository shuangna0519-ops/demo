<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f0f4ff; padding: 20px; }
    .container { max-width: 400px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; }
    .header { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 20px; text-align: center; }
    .header h2 { font-size: 22px; }
    .input-row { display: flex; padding: 16px; gap: 8px; border-bottom: 1px solid #eee; }
    .input-row input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
    .input-row button { padding: 10px 18px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .input-row button:hover { background: #5568d3; }
    ul { list-style: none; }
    li { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid #f0f0f0; gap: 10px; }
    li.done span { text-decoration: line-through; color: #aaa; }
    li input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; }
    li span { flex: 1; font-size: 14px; }
    li .del { background: none; border: none; color: #ff6b6b; cursor: pointer; font-size: 18px; }
    .empty { text-align: center; color: #aaa; padding: 30px; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
    <div class="header"><h2>📋 待办清单</h2></div>
    <div class="input-row">
        <input type="text" id="taskInput" placeholder="输入新任务..." />
        <button onclick="addTask()">添加</button>
    </div>
    <ul id="taskList"></ul>
</div>
<script>
let tasks = [];
function render() {
    const ul = document.getElementById('taskList');
    if (tasks.length === 0) {
        ul.innerHTML = '<div class="empty">暂无任务，添加一个吧！</div>';
        return;
    }
    ul.innerHTML = tasks.map((t, i) => `
        <li class="${t.done ? 'done' : ''}">
            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggle(${i})">
            <span>${t.text}</span>
            <button class="del" onclick="remove(${i})">×</button>
        </li>
    `).join('');
}
function addTask() {
    const input = document.getElementById('taskInput');
    const text = input.value.trim();
    if (!text) return;
    tasks.push({ text, done: false });
    input.value = '';
    render();
}
function toggle(i) { tasks[i].done = !tasks[i].done; render(); }
function remove(i) { tasks.splice(i, 1); render(); }
document.getElementById('taskInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
});
render();
</script>
</body>
</html>
