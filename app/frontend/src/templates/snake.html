<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>贪吃蛇小游戏</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f7f6;color:#31413d;min-height:100vh;display:flex;justify-content:center;padding:20px}
  .app{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center}
  h1{font-size:20px;font-weight:700;color:#0f5c4c}
  .sub{font-size:13px;color:#7b8d89;margin-top:6px;text-align:center}
  .stats{display:flex;gap:20px;margin:14px 0 10px;font-size:13px;color:#5b6d69}
  .stats b{color:#0f5c4c;font-variant-numeric:tabular-nums;font-size:16px}
  .wrap{position:relative;border:2px solid #0f5c4c;border-radius:10px;overflow:hidden;background:#eef7f5}
  canvas{display:block;touch-action:none}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(243,247,246,.92);text-align:center;padding:20px}
  .overlay h2{font-size:17px;color:#0f5c4c}
  .overlay p{font-size:13px;color:#6b7d79;line-height:1.6;max-width:260px}
  .overlay.hide{display:none}
  button{font:inherit;border-radius:8px;border:1px solid #cfdedb;background:#fff;padding:9px 14px;cursor:pointer;color:#31413d}
  .primary{background:#0f5c4c;color:#fff;border-color:#0f5c4c}
  .primary:hover{background:#0c4a3d}
  .dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:8px;margin-top:16px;justify-content:center}
  .dpad button{font-size:20px;padding:0;display:flex;align-items:center;justify-content:center}
  .dpad .sp{visibility:hidden}
  .help{margin-top:12px;font-size:12px;color:#8b9a96;text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="app">
  <h1>贪吃蛇小游戏</h1>
  <p class="sub">键盘方向键 / WASD 或屏幕方向键控制，吃到果实得分</p>

  <div class="stats">
    <span>得分 <b id="score">0</b></span>
    <span>最高分 <b id="best">0</b></span>
    <span>长度 <b id="len">3</b></span>
  </div>

  <div class="wrap">
    <canvas id="cv" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">准备开始</h2>
      <p id="ovText">用方向键控制小蛇吃到红色果实，撞墙或咬到自己就结束。</p>
      <button class="primary" id="ovBtn">开始游戏</button>
    </div>
  </div>

  <div class="dpad">
    <span class="sp"></span><button data-dir="up">▲</button><span class="sp"></span>
    <button data-dir="left">◀</button><span class="sp"></span><button data-dir="right">▶</button>
    <span class="sp"></span><button data-dir="down">▼</button><span class="sp"></span>
  </div>

  <p class="help">游戏开始后请先点击一次棋盘区域，再使用键盘操作。</p>
</div>

<script>
(function(){
  var GRID=20,CELL=20;
  var canvas=document.getElementById('cv');
  var ctx=canvas.getContext('2d');
  var snake,dir,nextDir,food,score,best=0,alive,running,timer;

  function reset(){
    snake=[{x:8,y:10},{x:7,y:10},{x:6,y:10}];
    dir={x:1,y:0};nextDir={x:1,y:0};
    score=0;alive=true;
    placeFood();
    updateStats();
  }

  function placeFood(){
    var free=[];
    for(var x=0;x<GRID;x++)for(var y=0;y<GRID;y++){
      var hit=false;
      for(var i=0;i<snake.length;i++)if(snake[i].x===x&&snake[i].y===y){hit=true;break}
      if(!hit)free.push({x:x,y:y});
    }
    food=free.length?free[Math.floor(Math.random()*free.length)]:{x:0,y:0};
  }

  function updateStats(){
    document.getElementById('score').textContent=score;
    document.getElementById('best').textContent=best;
    document.getElementById('len').textContent=snake.length;
  }

  function draw(){
    ctx.fillStyle='#eef7f5';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle='rgba(15,92,76,.07)';
    for(var i=1;i<GRID;i++){
      ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,canvas.height);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(canvas.width,i*CELL);ctx.stroke();
    }
    ctx.fillStyle='#d64545';
    ctx.beginPath();
    ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2-2,0,Math.PI*2);
    ctx.fill();
    for(var k=0;k<snake.length;k++){
      var s=snake[k];
      ctx.fillStyle=k===0?'#0f5c4c':'#3f8f7c';
      ctx.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2);
    }
  }

  function step(){
    dir=nextDir;
    var head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(head.x<0||head.y<0||head.x>=GRID||head.y>=GRID){gameOver('撞到墙了');return}
    for(var i=0;i<snake.length-1;i++)if(snake[i].x===head.x&&snake[i].y===head.y){gameOver('咬到自己了');return}
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){
      score+=10;
      if(score>best)best=score;
      placeFood();
    } else {
      snake.pop();
    }
    updateStats();
    draw();
  }

  function gameOver(reason){
    alive=false;running=false;
    if(timer)clearInterval(timer);
    showOverlay('游戏结束','很可惜，'+reason+'。得分 '+score+'，长度 '+snake.length+'。','再来一局');
    draw();
  }

  function showOverlay(title,text,btn){
    document.getElementById('ovTitle').textContent=title;
    document.getElementById('ovText').textContent=text;
    document.getElementById('ovBtn').textContent=btn;
    document.getElementById('overlay').classList.remove('hide');
  }

  function hideOverlay(){document.getElementById('overlay').classList.add('hide')}

  function start(){
    reset();hideOverlay();
    running=true;
    draw();
    if(timer)clearInterval(timer);
    timer=setInterval(step,120);
  }

  function turn(d){
    var map={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
    var nd=map[d];
    if(!nd)return;
    if(nd.x===-dir.x&&nd.y===-dir.y)return;
    nextDir=nd;
  }

  document.addEventListener('keydown',function(e){
    var k=e.key.toLowerCase();
    if(k==='arrowup'||k==='w'){turn('up');e.preventDefault()}
    else if(k==='arrowdown'||k==='s'){turn('down');e.preventDefault()}
    else if(k==='arrowleft'||k==='a'){turn('left');e.preventDefault()}
    else if(k==='arrowright'||k==='d'){turn('right');e.preventDefault()}
    else if(k===' '&&!running){start();e.preventDefault()}
  });

  document.querySelector('.dpad').addEventListener('click',function(e){
    var btn=e.target.closest('button[data-dir]');
    if(btn)turn(btn.dataset.dir);
  });

  var startX=0,startY=0;
  canvas.addEventListener('touchstart',function(e){
    var t=e.changedTouches[0];startX=t.clientX;startY=t.clientY;
  },{passive:true});
  canvas.addEventListener('touchend',function(e){
    var t=e.changedTouches[0];
    var dx=t.clientX-startX,dy=t.clientY-startY;
    if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
    if(Math.abs(dx)>Math.abs(dy))turn(dx>0?'right':'left');
    else turn(dy>0?'down':'up');
  },{passive:true});

  document.getElementById('ovBtn').addEventListener('click',start);
  reset();draw();
})();
</script>
</body>
</html>
